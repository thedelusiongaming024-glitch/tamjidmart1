<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Admin | Tamjid Mart</title><link rel="stylesheet" href="/style.css">
<style>
body{display:block}#app{min-height:100vh}
.lg{min-height:100vh;display:grid;place-items:center;padding:20px}.lgc{width:min(400px,100%);padding:34px;border-radius:26px}.lgc h1{font-size:40px;margin-bottom:6px}
.shell{display:grid;grid-template-columns:230px 1fr;gap:20px;padding:20px;max-width:1400px;margin:auto}
aside{position:sticky;top:20px;height:calc(100vh - 40px);border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:6px}
aside .logo{margin-bottom:16px}aside button.n{text-align:left;border:0;background:none;padding:11px 14px;border-radius:12px;color:var(--mut);font-weight:600}
aside button.n.on{background:var(--acc);color:#fff}aside button.n:hover:not(.on){background:#fff8}
main.pn{padding:0}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;gap:10px;flex-wrap:wrap}.top h2{font-size:38px}
.panel{border-radius:22px;padding:20px;margin-bottom:20px;overflow:auto}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:20px}.stat{padding:18px;border-radius:20px}.stat b{font:40px 'Instrument Serif',serif;display:block}.stat span{color:var(--mut);font-size:13px}
table{width:100%;border-collapse:collapse;min-width:560px}th{text-align:left;color:var(--mut);font-size:12px;padding:8px 10px}td{padding:10px;border-top:1px solid #0000000d;vertical-align:middle}
.tn{width:46px;height:46px;border-radius:12px;object-fit:cover;background:#dfe8e3;display:block}
.in,.ta{width:100%;padding:11px 14px;border-radius:12px;border:1px solid #0000001a;background:#fffc;font:inherit}.ta{min-height:90px;resize:vertical}
label.f{display:block;margin-bottom:14px;font-weight:600;font-size:13px}label.f .in,label.f .ta{margin-top:6px;font-weight:400}label.c{display:flex;gap:8px;align-items:center;margin-bottom:14px;font-weight:600;font-size:13px}
.fm{display:grid;grid-template-columns:1fr 1fr;gap:0 20px}.fm .w{grid-column:1/-1}
.ims{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}.ims div{position:relative}.ims img{width:74px;height:74px;border-radius:12px;object-fit:cover}.ims button.rm{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;border:0;background:#c0392b;color:#fff;font-size:13px}
.up{width:74px;height:74px;border-radius:12px;border:2px dashed #0003;display:grid;place-items:center;cursor:pointer;color:var(--mut);font-size:24px}
.pill{padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600;background:#1f5a4a1f;color:var(--acc)}.pill.off{background:#0001;color:var(--mut)}
.danger{color:#c0392b}.err{color:#c0392b;margin:10px 0;min-height:20px;font-size:13px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 22px;border-radius:14px;z-index:99}
.mo .md{display:block;width:min(680px,100%)}.mo .md h2{font-size:34px;margin:0 0 16px}
@media(max-width:860px){.shell{grid-template-columns:1fr}aside{position:static;height:auto;flex-direction:row;flex-wrap:wrap}.fm{grid-template-columns:1fr}}
</style></head><body><div id="app"></div><div class="mo" id="mo"><div class="md glass" id="md"></div></div>
<script>
const $=(s,r=document)=>r.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const api=async(u,m='GET',b)=>{const r=await fetch('/api'+u,{method:m,headers:{'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined}),j=await r.json().catch(()=>({}));if(r.status===401&&u!=='/login'){showLogin();throw new Error('Please sign in.')}if(!r.ok)throw new Error(j.error||'Something went wrong.');return j};
let D,tab='dashboard',q='';
const toast=t=>{const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),2200)};
const thumb=u=>/^\/uploads\/.+\.webp$/.test(u||'')?u.replace(/\.webp$/,'-t.webp'):u,nw=()=>D.enquiries.filter(e=>e.status==='new').length;
const cname=id=>D.categories.find(c=>c.id===id)?.name||'None';
const th=s=>s?`<img class="tn" src="${esc(thumb(s))}" alt="">`:'<span class="tn"></span>';
const SCH={products:[['name','Product name','text',1],['category','Collection','cat'],['description','Description','area',1],['highlights','Highlights (one per line)','area',1],['images','Images','imgs',1],['badge','Badge, e.g. New or Sale','text'],['seoTitle','SEO title (optional, up to 60 characters)','text'],['seoDescription','SEO description (optional, up to 160 characters)','text',1],['featured','Show in Recommended','chk'],['active','Visible on website','chk']],
 categories:[['name','Collection name','text',1],['description','Short description','text',1],['image','Cover image','img',1]],
 banners:[['title','Headline','text',1],['subtitle','Subtitle','text',1],['btnText','Button text','text'],['btnLink','Button link, e.g. #products','text'],['image','Background image','img',1],['active','Visible on website','chk']]};
const ST=[['siteName','Business name'],['tagline','Tagline'],['whatsapp','WhatsApp number with country code, digits only, e.g. 8801XXXXXXXXX'],['phone','Phone number for calls'],['email','Email'],['address','Address'],['hours','Opening hours'],['facebook','Facebook page link'],['instagram','Instagram link'],['youtube','YouTube link'],['logo','Logo (optional)','img'],['aboutText','About text in footer','area'],['waMessage','WhatsApp message. Use {product} for the product name.','area']];
async function load(){D=await api('/admin/all');render()}
function showLogin(){$('#app').innerHTML=`<div class="lg"><div class="lgc glass"><h1>Tamjid Mart</h1><p style="color:var(--mut);margin-bottom:20px">Sign in to manage your website.</p><label class="f">Username<input class="in" id="u" autocomplete="username"></label><label class="f">Password<input class="in" id="p" type="password" autocomplete="current-password"></label><div class="err" id="e"></div><button class="btn" style="width:100%" id="go">Sign in</button></div></div>`;
 const go=async()=>{try{await api('/login','POST',{user:$('#u').value,password:$('#p').value});load()}catch(x){$('#e').textContent=x.message}};$('#go').onclick=go;$('#p').onkeydown=e=>e.key==='Enter'&&go()}
const NAV=[['dashboard','Dashboard'],['products','Products'],['categories','Collections'],['banners','Hero banners'],['enquiries','Enquiries'],['seo','SEO'],['settings','Settings'],['account','Account']];
function render(){$('#app').innerHTML=`<div class="shell"><aside class="glass"><div class="logo">${esc(D.settings.siteName)}</div>${NAV.map(n=>`<button class="n ${tab===n[0]?'on':''}" data-tab="${n[0]}">${n[1]}${n[0]==='enquiries'&&nw()?` (${nw()})`:''}</button>`).join('')}<a class="btn ghost sm" href="/" target="_blank" style="margin-top:auto">View website</a><button class="btn ghost sm" id="out">Sign out</button></aside><main class="pn" id="pn"></main></div>`;
 $('#out').onclick=async()=>{await api('/logout','POST');showLogin()};document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;q='';render()});({dashboard,products:()=>lst('products'),categories:()=>lst('categories'),banners:()=>lst('banners'),settings,account,enquiries,seo})[tab]()}
function dashboard(){const P=D.products,v=P.reduce((a,p)=>a+p.views,0),c=P.reduce((a,p)=>a+p.contacts,0),top=k=>[...P].sort((a,b)=>b[k]-a[k]).slice(0,5).filter(p=>p[k]).map(p=>`<tr><td>${esc(p.name)}</td><td style="text-align:right">${p[k]}</td></tr>`).join('')||'<tr><td style="color:var(--mut)">No data yet</td></tr>';
 $('#pn').innerHTML=`<div class="top"><h2>Dashboard</h2></div><div class="stats">${[['Products',P.length],['Visible',P.filter(p=>p.active).length],['Collections',D.categories.length],['Product views',v],['Contact clicks',c],['New enquiries',nw()]].map(s=>`<div class="stat glass"><b>${s[1]}</b><span>${s[0]}</span></div>`).join('')}</div><div class="fm"><div class="panel glass"><h3 style="font-size:24px;margin-bottom:8px">Most viewed</h3><table style="min-width:0">${top('views')}</table></div><div class="panel glass"><h3 style="font-size:24px;margin-bottom:8px">Most contacted</h3><table style="min-width:0">${top('contacts')}</table></div></div>`}
function lst(col){const T={products:'Products',categories:'Collections',banners:'Hero banners'}[col];let items=D[col].filter(i=>(i.name||i.title).toLowerCase().includes(q));
 const row=i=>col==='products'?`<td>${th(i.images[0])}</td><td><b>${esc(i.name)}</b><br><small style="color:var(--mut)">${esc(cname(i.category))}${i.featured?' · Recommended':''}</small></td><td>${i.views}</td><td>${i.contacts}</td>`:col==='categories'?`<td>${th(i.image)}</td><td><b>${esc(i.name)}</b><br><small style="color:var(--mut)">${D.products.filter(p=>p.category===i.id).length} products</small></td>`:`<td>${th(i.image)}</td><td><b>${esc(i.title)}</b><br><small style="color:var(--mut)">${esc(i.subtitle)}</small></td>`;
 $('#pn').innerHTML=`<div class="top"><h2>${T}</h2><div style="display:flex;gap:8px"><input class="in" id="sq" placeholder="Search" value="${esc(q)}" style="width:190px"><button class="btn" id="add">Add new</button></div></div><div class="panel glass"><table><thead><tr><th></th><th>Name</th>${col==='products'?'<th>Views</th><th>Contacts</th>':''}<th>Status</th><th></th></tr></thead><tbody>${items.map(i=>`<tr>${row(i)}<td>${'active' in i?`<span class="pill ${i.active?'':'off'}">${i.active?'Visible':'Hidden'}</span>`:''}</td><td style="text-align:right;white-space:nowrap"><button class="btn ghost sm" data-e="${i.id}">Edit</button> <button class="btn ghost sm danger" data-d="${i.id}">Delete</button></td></tr>`).join('')||'<tr><td colspan=6 style="color:var(--mut);padding:30px">Nothing here yet. Click Add new to create your first one.</td></tr>'}</tbody></table></div>`;
 $('#sq').oninput=e=>{q=e.target.value.toLowerCase();lst(col);$('#sq').focus();$('#sq').setSelectionRange(q.length,q.length)};$('#add').onclick=()=>form(col);
 document.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>form(col,D[col].find(i=>i.id===b.dataset.e)));
 document.querySelectorAll('[data-d]').forEach(b=>b.onclick=async()=>{if(confirm('Delete this permanently?')){await api(`/admin/${col}/${b.dataset.d}`,'DELETE');toast('Deleted');load()}})}
async function upload(f){if(!f)return;const bm=await createImageBitmap(f),enc=w=>{const k=Math.min(1,w/Math.max(bm.width,bm.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(bm.width*k));c.height=Math.max(1,Math.round(bm.height*k));c.getContext('2d').drawImage(bm,0,0,c.width,c.height);return c.toDataURL('image/webp',.82)};
 return (await api('/admin/upload','POST',{data:enc(1600),thumb:enc(480)})).url}
function fields(sch,v,st){return sch.map(([k,l,t,w])=>{const c=w?'w':'';if(t==='chk')return `<label class="c ${c}"><input type="checkbox" data-k="${k}" ${v[k]!==false&&(v[k]||!(k in v))?'checked':''}>${l}</label>`;
 if(t==='area')return `<label class="f w">${l}<textarea class="ta" data-k="${k}">${esc(v[k]||'')}</textarea></label>`;
 if(t==='cat')return `<label class="f">${l}<select class="in" data-k="${k}"><option value="">None</option>${D.categories.map(c=>`<option value="${c.id}" ${v[k]===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></label>`;
 if(t==='img'||t==='imgs')return `<div class="f w"><span class="f" style="margin:0">${l}</span><div class="ims" data-im="${k}" data-multi="${t==='imgs'}"></div></div>`;
 return `<label class="f ${c}">${l}<input class="in" data-k="${k}" value="${esc(v[k]||'')}"></label>`}).join('')}
function imgUI(root,st){root.querySelectorAll('[data-im]').forEach(el=>{const k=el.dataset.im,multi=el.dataset.multi==='true',draw=()=>{const a=st[k];el.innerHTML=a.map((u,i)=>`<div><img src="${esc(thumb(u))}" alt=""><button class="rm" data-r="${i}" aria-label="Remove">&times;</button></div>`).join('')+(multi||!a.length?`<label class="up" title="Upload">+<input type="file" accept="image/*" hidden ${multi?'multiple':''}></label>`:'');
 el.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{a.splice(+b.dataset.r,1);draw()});const fi=el.querySelector('input');if(fi)fi.onchange=async()=>{try{for(const f of fi.files)a.push(await upload(f));draw()}catch(x){toast(x.message)}}};draw()})}
function collect(root,st,sch){const o={};sch.forEach(([k,,t])=>{const e=root.querySelector(`[data-k="${k}"]`);if(t==='chk')o[k]=e.checked;else if(t==='img')o[k]=st[k][0]||'';else if(t==='imgs')o[k]=st[k];else o[k]=e.value.trim()});return o}
function form(col,item){const sch=SCH[col],v=item||{},st={};sch.forEach(([k,,t])=>{if(t==='img')st[k]=v[k]?[v[k]]:[];if(t==='imgs')st[k]=[...(v[k]||[])]});
 $('#md').innerHTML=`<h2>${item?'Edit':'Add'} ${{products:'product',categories:'collection',banners:'banner'}[col]}</h2><div class="fm">${fields(sch,v,st)}</div><div class="err" id="fe"></div><div style="display:flex;gap:10px;justify-content:flex-end"><button class="btn ghost" id="cx">Cancel</button><button class="btn" id="sv">Save changes</button></div>`;
 $('#mo').classList.add('on');imgUI($('#md'),st);$('#cx').onclick=()=>$('#mo').classList.remove('on');
 $('#sv').onclick=async()=>{const o=collect($('#md'),st,sch);if(!(o.name||o.title))return $('#fe').textContent='Please enter a name.';try{await api(item?`/admin/${col}/${item.id}`:`/admin/${col}`,item?'PUT':'POST',o);$('#mo').classList.remove('on');toast('Saved');load()}catch(x){$('#fe').textContent=x.message}}}
function settings(){const st={logo:D.settings.logo?[D.settings.logo]:[]},sch=ST.map(([k,l,t])=>[k,l,t||'text',['aboutText','waMessage','logo'].includes(k)]);
 $('#pn').innerHTML=`<div class="top"><h2>Settings</h2></div><div class="panel glass"><div class="fm" id="sf">${fields(sch,D.settings,st)}</div><div class="err" id="fe"></div><button class="btn" id="sv">Save settings</button></div>`;imgUI($('#pn'),st);
 $('#sv').onclick=async()=>{try{await api('/admin/settings','PUT',collect($('#sf'),st,sch));toast('Settings saved');load()}catch(x){$('#fe').textContent=x.message}}}
function account(){$('#pn').innerHTML=`<div class="top"><h2>Account</h2></div><div class="panel glass" style="max-width:480px"><label class="f">Username<input class="in" id="au" value="${esc(D.user)}"></label><label class="f">Current password<input class="in" id="ac" type="password" autocomplete="current-password"></label><label class="f">New password, at least 8 characters<input class="in" id="an" type="password" autocomplete="new-password"></label><div class="err" id="fe"></div><button class="btn" id="sv">Update account</button></div>`;
 $('#sv').onclick=async()=>{try{await api('/admin/password','POST',{user:$('#au').value,current:$('#ac').value,password:$('#an').value});toast('Account updated');$('#ac').value=$('#an').value=''}catch(x){$('#fe').textContent=x.message}}}
const wnum=p=>{p=p.replace(/\D/g,'');return p.startsWith('0')?'880'+p.slice(1):p};
function enquiries(){$('#pn').innerHTML=`<div class="top"><h2>Enquiries</h2></div>${D.enquiries.map(e=>`<div class="panel glass" style="${e.status==='new'?'border-left:4px solid var(--acc)':''}"><div class="top" style="margin:0 0 8px"><div><b>${esc(e.name)}</b> <span class="pill ${e.status==='new'?'':'off'}">${e.status==='new'?'New':e.status==='replied'?'Replied':'Read'}</span><br><small style="color:var(--mut)">${new Date(e.createdAt).toLocaleString()} · ${esc(e.phone)}${e.productName?` · ${esc(e.productName)}`:''}</small></div><div style="display:flex;gap:6px;flex-wrap:wrap"><a class="btn sm" target="_blank" rel="noopener" href="https://wa.me/${wnum(e.phone)}" data-st="${e.id}:replied">WhatsApp reply</a><a class="btn ghost sm" href="tel:${esc(e.phone)}" data-st="${e.id}:replied">Call</a>${e.status==='new'?`<button class="btn ghost sm" data-st="${e.id}:read">Mark read</button>`:''}<button class="btn ghost sm danger" data-dq="${e.id}">Delete</button></div></div><p style="white-space:pre-wrap">${esc(e.message)}</p></div>`).join('')||'<div class="panel glass" style="color:var(--mut)">No enquiries yet. Messages from your website form will appear here.</div>'}`;
 document.querySelectorAll('[data-st]').forEach(b=>b.addEventListener('click',async()=>{const [id,s]=b.dataset.st.split(':');try{await api('/admin/enquiries/'+id,'PUT',{status:s});D.enquiries.find(x=>x.id===id).status=s;setTimeout(render,50)}catch(x){toast(x.message)}}));
 document.querySelectorAll('[data-dq]').forEach(b=>b.onclick=async()=>{if(confirm('Delete this enquiry?')){await api('/admin/enquiries/'+b.dataset.dq,'DELETE');toast('Deleted');load()}})}
function seo(){const S=D.settings,keys=[['siteUrl','Website address, e.g. https://tamjidmart.com'],['seoTitle','Home page title (up to 60 characters)'],['seoDescription','Home page description (up to 160 characters)','area'],['keywords','Keywords, separated by commas'],['ogImage','Social sharing image','img'],['gtmId','Google Tag Manager ID, e.g. GTM-XXXXXXX'],['gaId','Google Analytics ID, e.g. G-XXXXXXXXXX']],st={ogImage:S.ogImage?[S.ogImage]:[]},sch=keys.map(([k,l,t])=>[k,l,t||'text',['seoDescription','ogImage','siteUrl'].includes(k)]);
 const issues=p=>{const i=[];if(!p.images.length)i.push('No image');if((p.description||'').length<50)i.push('Short description');if((p.seoTitle||p.name).length>60)i.push('Title over 60');if(!p.seoDescription)i.push('No SEO description');else if(p.seoDescription.length>160)i.push('Description over 160');return i};
 $('#pn').innerHTML=`<div class="top"><h2>SEO</h2><div style="display:flex;gap:8px"><a class="btn ghost sm" href="/sitemap.xml" target="_blank">View sitemap</a><a class="btn ghost sm" href="/robots.txt" target="_blank">View robots.txt</a></div></div><div class="panel glass"><p style="color:var(--mut);margin-bottom:14px">Each product has its own page, prepared on the server for search engines, with structured data and a dataLayer. The sitemap updates automatically. Submit <b>/sitemap.xml</b> in Google Search Console.</p><div class="fm" id="sf">${fields(sch,S,st)}</div><div class="err" id="fe"></div><button class="btn" id="sv">Save SEO settings</button></div><div class="panel glass"><h3 style="font-size:24px;margin-bottom:8px">Product SEO check</h3><table><thead><tr><th>Product</th><th>Issues</th><th></th></tr></thead><tbody>${D.products.map(p=>`<tr><td><b>${esc(p.name)}</b></td><td>${issues(p).map(i=>`<span class="pill off">${i}</span> `).join('')||'<span class="pill">Good</span>'}</td><td style="text-align:right"><button class="btn ghost sm" data-fx="${p.id}">Fix</button></td></tr>`).join('')}</tbody></table></div>`;
 imgUI($('#pn'),st);$('#sv').onclick=async()=>{try{await api('/admin/settings','PUT',collect($('#sf'),st,sch));toast('SEO settings saved');load()}catch(x){$('#fe').textContent=x.message}};
 document.querySelectorAll('[data-fx]').forEach(b=>b.onclick=()=>form('products',D.products.find(p=>p.id===b.dataset.fx)))}
$('#mo').onclick=e=>{if(e.target.id==='mo')$('#mo').classList.remove('on')};
api('/admin/all').then(d=>{D=d;render()}).catch(showLogin);
</script></body></html>
